[config]
#Benchmark result directory
json_dir = ~/pybench_results
debug = false

[scm]
repo_dir = ~/cpython
git_remote = https://github.com/python/cpython.git

[compile]
bench_dir = ~/pybench_builds
lto = false
pgo = True
install = True
jobs = 4
# pkg dependencies are handled in the installation scripts
# jobs should probably be set at the time of execution by the system

[run_benchmark]
system_tune = True
benchmarks = 2to3 chameleon docutils html5lib sphinx tornado_http 
upload = False

